<!DOCTYPE html>
<!--
  TTS Studio — "Published" page.

  What the Google Doc watcher (doc_watcher.py) has attached to WordPress: each
  generated audio, playable, beside the article it went to. For checking in
  now and then that nothing is landing on the wrong post.

  Static on purpose — the data comes from /api/wp_publishes, which main.py
  reads from the watcher's append-only publish log, and the Queue panel from
  /api/backfill_status (wp_backfill.py's state), refreshed every 15 s, with the
  post narrating now polled from /api/projects/<id>/progress every 3 s. In
  server mode those APIs are behind the access code, so this page carries
  nothing on its own.
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Published — TTS Studio</title>
    <link rel="stylesheet" href="/static/style.css?v=__APP_VERSION__">
    <style>
        .pub-header { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
        .pub-header a { color: var(--primary); text-decoration: none; }
        .pub-table { width: 100%; border-collapse: collapse; }
        .pub-table th { text-align: left; font-size: 0.8rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; padding: 0 0.75rem 0.6rem; border-bottom: 1px solid var(--glass-border); }
        .pub-table td { padding: 0.9rem 0.75rem; border-bottom: 1px solid var(--glass-border); vertical-align: top; }
        .pub-table td:first-child { width: 50%; }
        .pub-table audio { width: 100%; max-width: 420px; height: 36px; display: block; }
        .pub-meta { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.35rem; overflow-wrap: anywhere; }
        .pub-meta a { color: var(--text-muted); }
        .pub-article { color: var(--primary); font-weight: 600; text-decoration: none; overflow-wrap: anywhere; }
        .pub-article:hover { text-decoration: underline; }
        .pub-flag { display: inline-block; font-size: 0.72rem; font-weight: 600; padding: 0.05rem 0.45rem; border-radius: 999px; border: 1px solid var(--glass-border); color: var(--text-muted); margin-left: 0.35rem; vertical-align: 1px; }
        .pub-empty { color: var(--text-muted); padding: 2rem 0; text-align: center; }
        .pub-header-right { display: flex; align-items: baseline; gap: 1rem; }
        .q-pill { font-size: 0.85rem; font-weight: 600; padding: 0.2rem 0.7rem; border-radius: 999px; border: 1px solid var(--glass-border); font-variant-numeric: tabular-nums; }
        .q-panel { margin-bottom: 1.5rem; }
        .q-panel h2 { font-size: 1rem; margin: 0 0 0.75rem; }
        .q-stats { display: flex; flex-wrap: wrap; gap: 0.5rem 2rem; margin-bottom: 0.75rem; }
        .q-stat b { font-size: 1.4rem; font-variant-numeric: tabular-nums; display: block; }
        .q-stat span { font-size: 0.8rem; color: var(--text-muted); }
        .q-line { font-size: 0.9rem; margin: 0.35rem 0; overflow-wrap: anywhere; }
        .q-line a, .q-list a { color: var(--primary); text-decoration: none; }
        .q-line a:hover, .q-list a:hover { text-decoration: underline; }
        .q-list { margin: 0.25rem 0 0; padding-left: 1.2rem; font-size: 0.9rem; }
        .q-list li { margin: 0.2rem 0; }
        .q-muted { color: var(--text-muted); font-size: 0.8rem; }
        .q-progress { display: flex; align-items: center; gap: 0.75rem; margin: 0.5rem 0 0.9rem; }
        .q-ring { width: 40px; height: 40px; flex: none; }
        .q-ring svg { width: 100%; height: 100%; display: block; transform: rotate(-90deg); }
        .q-ring .track { stroke: var(--glass-border); }
        .q-ring .fill { stroke: var(--primary); transition: stroke-dashoffset 0.6s ease; }
        /* The inner arc turns while a paragraph is being generated. */
        .q-ring .spin { stroke: var(--text-main); opacity: 0.6; transform-box: view-box; transform-origin: center;
                        animation: q-spin 1.1s linear infinite; }
        .q-ring.idle .spin { display: none; }
        @keyframes q-spin { to { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) { .q-ring .spin { animation: none; } }
        .q-prog-text b { display: block; font-size: 0.95rem; font-variant-numeric: tabular-nums; }
        .q-prog-text span { font-size: 0.8rem; color: var(--text-muted); font-variant-numeric: tabular-nums; }
        @media (max-width: 640px) {
            .pub-table, .pub-table tbody { display: block; }
            .pub-table thead { display: none; }
            .pub-table tr { display: block; border-bottom: 1px solid var(--glass-border); padding: 0.75rem 0; }
            .pub-table td { display: block; width: auto !important; border: none; padding: 0.3rem 0; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="pub-header">
            <h1>Published</h1>
            <div class="pub-header-right">
                <span id="q-pill" class="q-pill hidden" title="Posts left to narrate, plus edits waiting to be re-narrated"></span>
                <a href="/">&larr; Back to TTS Studio</a>
            </div>
        </div>
        <div id="q-panel" class="glass q-panel hidden">
            <h2>Queue</h2>
            <div class="q-stats" id="q-stats"></div>
            <div id="q-detail"></div>
            <p class="q-muted" id="q-asof"></p>
        </div>
        <p class="subtitle">Audio the Google Doc watcher attached to WordPress, newest first.</p>
        <div class="glass">
            <table class="pub-table">
                <thead><tr><th>Audio</th><th>Article</th></tr></thead>
                <tbody id="pub-rows"></tbody>
            </table>
            <p id="pub-status" class="pub-empty">Loading…</p>
        </div>
    </div>
    <script>
    // The Queue panel: what the backfill is doing and has left.
    (() => {
        const $ = (id) => document.getElementById(id);
        const el = (tag, props = {}, ...children) => {
            const node = Object.assign(document.createElement(tag), props);
            node.append(...children);
            return node;
        };
        const time = (iso) => {
            const d = new Date(iso);
            return isNaN(d) ? '' : d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
        };
        // A queued post: its title, linked to the post when the link is known.
        const postLink = (p) => {
            const title = p.title || `Post ${p.post_id}`;
            return p.permalink
                ? el('a', { href: p.permalink, target: '_blank', rel: 'noopener', textContent: title })
                : title;
        };
        const stat = (n, label) => el('div', { className: 'q-stat' }, el('b', { textContent: n }), el('span', { textContent: label }));

        // Live progress of the post narrating now: a ring that fills as
        // paragraphs finish, polled every few seconds from the app. One node,
        // updated in place, so the ring animates between polls and survives
        // the panel's own refresh.
        const R = 16, C = 2 * Math.PI * R;
        const progress = el('div', { className: 'q-progress', role: 'progressbar' });
        progress.innerHTML = `<div class="q-ring"><svg viewBox="0 0 40 40" aria-hidden="true">
            <circle class="track" cx="20" cy="20" r="${R}" fill="none" stroke-width="4"/>
            <circle class="fill" cx="20" cy="20" r="${R}" fill="none" stroke-width="4" stroke-linecap="round"
                    stroke-dasharray="${C}" stroke-dashoffset="${C}"/>
            <circle class="spin" cx="20" cy="20" r="9" fill="none" stroke-width="2.5" stroke-linecap="round"
                    stroke-dasharray="14 100"/></svg></div>
            <div class="q-prog-text"><b></b><span></span></div>`;
        let progressFor = null;     // project id of the post narrating now

        function showProgress(p) {
            const [ring, fill] = [progress.querySelector('.q-ring'), progress.querySelector('.fill')];
            const [main, sub] = [progress.querySelector('b'), progress.querySelector('span')];
            const status = p ? String(p.status || '') : '';
            const frac = p && p.total ? p.done / p.total : 0;
            fill.style.strokeDashoffset = C * (1 - frac);
            progress.setAttribute('aria-valuenow', Math.round(frac * 100));
            ring.classList.toggle('idle', status.startsWith('done ('));
            if (!p || !p.total) {
                [main.textContent, sub.textContent] = ['Starting…', ''];
            } else if (status === 'done') {
                [main.textContent, sub.textContent] = ['All paragraphs generated', 'Publishing to WordPress…'];
            } else if (status.startsWith('done (')) {
                [main.textContent, sub.textContent] = ['Finished with gaps', `${p.done} of ${p.total} paragraphs — not publishing`];
            } else {
                main.textContent = `Paragraph ${Math.min(p.done + 1, p.total)} of ${p.total}`;
                sub.textContent = `${p.done} done · ${Math.round(frac * 100)}%`;
            }
        }

        async function pollProgress() {
            const id = progressFor;
            if (!id) return;
            try {
                const res = await fetch(`/api/projects/${encodeURIComponent(id)}/progress`);
                if (res.ok && id === progressFor) showProgress(await res.json());
            } catch {}
        }

        async function refresh() {
            let s;
            try {
                const res = await fetch('/api/backfill_status');
                if (!res.ok) return;
                s = await res.json();
            } catch {
                return;
            }
            if (!s.available) return;
            const posts = s.remaining ?? 0;
            const edits = (s.renarrate || []).length;
            $('q-pill').textContent = `${posts + edits} left`;
            $('q-pill').classList.remove('hidden');

            $('q-stats').replaceChildren(
                stat(s.narrated ?? '…', 'posts narrated'),
                stat(s.remaining ?? '…', 'posts left to narrate'),
                stat(edits, 'edits to re-narrate'));

            const detail = [];
            const project = (s.current && s.current.project_id) || null;
            if (project !== progressFor) {
                progressFor = project;
                showProgress(null);
                pollProgress();
            }
            if (s.current) {
                const verb = s.current.kind === 'renarrate' ? 'Re-narrating' : 'Narrating';
                detail.push(el('p', { className: 'q-line' }, `${verb} now: `, postLink(s.current),
                    s.current.started_at ? ` (since ${time(s.current.started_at)})` : ''));
                if (project) detail.push(progress);
            } else {
                // The backfill restarts the app between posts, so this lasts a
                // minute or two (longer while a Google Doc goes first).
                detail.push(el('p', { className: 'q-line' },
                    posts + edits ? 'Starting the next post (the app restarts between posts)…' : 'All caught up.'));
            }
            if (edits) {
                detail.push(el('p', { className: 'q-line' }, 'Waiting to be re-narrated:'),
                    el('ul', { className: 'q-list' }, ...s.renarrate.map(r =>
                        el('li', {}, postLink(r),
                            r.ready_at ? el('span', { className: 'q-muted', textContent: `  · from ${time(r.ready_at)}` }) : ''))));
            }
            if ((s.upload_pending || []).length) {
                detail.push(el('p', { className: 'q-line' }, 'Narrated, upload being retried:'),
                    el('ul', { className: 'q-list' }, ...s.upload_pending.map(u =>
                        el('li', {}, postLink(u)))));
            }
            if (!s.renarrate_enabled) {
                detail.push(el('p', { className: 'q-muted', textContent: 'Re-narrating edited posts is off.' }));
            }
            $('q-detail').replaceChildren(...detail);
            const stale = Date.now() - new Date(s.as_of) > 15 * 60 * 1000;
            $('q-asof').textContent = `Updated ${time(s.as_of)}${stale ? ' — the backfill may be stopped' : ''}`;
            $('q-panel').classList.remove('hidden');
        }
        refresh();
        setInterval(refresh, 15000);
        setInterval(pollProgress, 3000);
    })();

    (async () => {
        const rows = document.getElementById('pub-rows');
        const status = document.getElementById('pub-status');
        const el = (tag, props = {}, ...children) => {
            const node = Object.assign(document.createElement(tag), props);
            node.append(...children);
            return node;
        };

        let res;
        try {
            res = await fetch('/api/wp_publishes');
        } catch {
            status.textContent = "Couldn't reach TTS Studio.";
            return;
        }
        if (res.status === 401) {
            status.replaceChildren('This page needs the access code — ',
                el('a', { href: '/', textContent: 'open TTS Studio' }),
                ', enter it there, then come back.');
            return;
        }
        if (!res.ok) {
            status.textContent = `Couldn't load the publish log (${res.status}).`;
            return;
        }
        const { entries } = await res.json();
        if (!entries.length) {
            status.textContent = 'Nothing has been published yet.';
            return;
        }
        status.remove();

        const when = (iso) => {
            const d = new Date(iso);
            return isNaN(d) ? '' : d.toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' });
        };

        for (const e of entries) {
            // Audio column: the player, then which doc it came from and when.
            const audioCell = el('td');
            if (e.audio_url) {
                audioCell.append(el('audio', { controls: true, preload: 'none', src: e.audio_url }));
            }
            const docLabel = e.doc_url
                ? el('a', { href: e.doc_url, target: '_blank', rel: 'noopener', textContent: e.doc || 'doc' })
                : (e.doc || '');
            audioCell.append(el('div', { className: 'pub-meta' }, docLabel, ` · ${when(e.at)}`));

            // Article column: the post it went to, plus anything worth a second look.
            const articleCell = el('td');
            articleCell.append(el('a', {
                className: 'pub-article', href: e.permalink || '#', target: '_blank', rel: 'noopener',
                textContent: e.post_title || `Post ${e.post_id}`,
            }));
            if (e.post_status && e.post_status !== 'publish') {
                articleCell.append(el('span', { className: 'pub-flag', textContent: e.post_status }));
            }
            if (e.matched_by === 'reply') {
                articleCell.append(el('span', { className: 'pub-flag', textContent: 'picked by reply' }));
            }
            if (e.matched_by === 'backfill') {
                articleCell.append(el('span', { className: 'pub-flag', textContent: 'from post text' }));
            }
            // The audio field is written first, so it's the first key recorded.
            const replaced = Object.values(e.replaced || {})[0];
            const notes = [`post ${e.post_id}`];
            if (replaced) notes.push(`replaced narration #${replaced}`);
            articleCell.append(el('div', { className: 'pub-meta', textContent: notes.join(' · ') }));

            rows.append(el('tr', {}, audioCell, articleCell));
        }
    })();
    </script>
</body>
</html>
